
services:
  school-database:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD : ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: online_business_school_flyway
      MYSQL_USER: ${DOCKER_DB_USER}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD}
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - school-database_data:/var/lib/mysql

  online-school-backend:
    build: .
    ports:
      - "8080:8080"
    environment:
     SPRING_DATASOURCE_URL: jdbc:mysql://school-database:3306/online_business_school_flyway
     DOCKER_DB_USER: ${DOCKER_DB_USER}
     DOCKER_DB_PASSWORD: ${DOCKER_DB_PASSWORD}
    depends_on:
      school-database:
        condition: service_healthy





volumes:
  school-database_data:
